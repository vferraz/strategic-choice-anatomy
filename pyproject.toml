[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strategic-choice-anatomy"
version = "0.1.0"
description = "The internal anatomy of strategic choice in large language models — code and analysis for the 2x2-game substrate, causal steering, and layered representational analysis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Base runtime: everything the torch-free surface of the package needs.
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
# Tier 1 + Tier 2: rebuild figures and regenerate tables. No GPU, no torch.
# Every entry below has at least one import site in the shipped tree. `umap-learn`,
# `nbconvert`, `jupyter` and `jupytext` were dropped in phase 4: zero import sites each
# (executed notebooks are not part of the release), and `jupyter` alone pulled in the whole
# JupyterLab stack, which dominated a CI install. `nbformat` stays — analysis/layer_a/
# build_notebooks.py and the two _make_notebooks.py helpers genuinely import it.
analysis = [
    "scipy>=1.11.0",
    # Pinned, not floored: four committed Layer-A tables (s_attribution_shap,
    # s_shap_beeswarm, s_shap_delta1_dependence, s_variance_partition) are sha256-identical
    # under 1.8.0 and differ under 1.9.0 (SHAP tie order). The pin exists for byte-level
    # reproduction of the released tables, not for correctness. See docs/ENVIRONMENTS.md.
    "scikit-learn==1.8.0",
    "matplotlib>=3.7.0",
    "statsmodels>=0.14.0",
    "shap>=0.44.0",
    "nashpy>=0.0.35",
    "adjustText>=1.0.0",
    "nbformat>=5.9.0",
]

# Tier 3: re-collect the substrate. bitsandbytes 8-bit loading is CUDA/Linux only.
# PINNED, not floored (Phase 6, 2026-09-07): these are the exact versions the released
# substrate and the q=0.5 steering arm were produced under, read from the live `.venv` on
# the DGX Spark. transformers is version-sensitive in two documented places — the forward
# hook semantics behind the injection-depth off-by-one, and the harmony chat-template
# `Current date:` line — so a floor here would silently change the intervention. See
# docs/ENVIRONMENTS.md for the full freeze and the platform notes.
gpu = [
    "torch==2.11.0",
    "transformers==5.5.0",
    "accelerate==1.13.0",
    "tokenizers==0.22.2",
    "safetensors==0.7.0",
    "bitsandbytes==0.49.2; sys_platform == 'linux'",
]

# GPT-OSS MXFP4 kernel stack, pinned from the live `.venv_gptoss` on the Spark.
# `kernels` is what makes the MXFP4 path available; preflight_gptoss.py aborts up front
# without it, which is the usual symptom of running this arm in the dense env.
gptoss = [
    "kernels==0.12.3",
    "openai-harmony==0.0.8",
    "triton==3.6.0; sys_platform == 'linux'",
]

dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
# Only the library is distributed. `collection/`, `steering/` (and later
# `features/`, `analysis/`) are repository scripts, deliberately NOT installed —
# `collection` and `analysis` are far too generic to claim as top-level import
# names in a published wheel.
packages = ["strategic_anatomy"]
# ...but an editable install writes the repository root onto sys.path, so a script
# run as `python collection/generate_dense_substrate.py` (where sys.path[0] is
# `collection/`, not the repo root) can still do `from steering.causal_common import ...`.
# This is what lets every source file stay free of sys.path manipulation.
dev-mode-dirs = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Second, independent path mechanism, so the suite also passes without an editable install.
pythonpath = ["."]
addopts = ["-ra", "--strict-markers"]
markers = [
    "tier2: regenerates a table from the released substrate and hash-compares it against the committed copy (needs SCA_DATA_ROOT)",
    "gpu: requires a CUDA GPU and the [gpu] extra",
]
